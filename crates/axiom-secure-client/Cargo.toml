[package]
name = "axiom-secure-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
axiom-inference.workspace = true
chacha20poly1305 = "0.10.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.2.0", features = ["hazmat", "zeroize"] }
hex = "0.4.3"
hkdf = "0.12.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
tokio-util = "0.7.17"
url = "2.5.7"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "1.8.2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.9.0"
