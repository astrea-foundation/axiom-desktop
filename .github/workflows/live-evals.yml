name: scheduled live evaluations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"

permissions:
  contents: read

concurrency:
  group: axiomcli-live-evaluation
  cancel-in-progress: false

jobs:
  live-model:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AXIOM_API_KEY: ${{ secrets.AXIOM_EVAL_API_KEY }}
      AXIOM_LIVE_BASE_URL: ${{ secrets.AXIOM_EVAL_BASE_URL }}
      AXIOM_LIVE_MODEL: ${{ secrets.AXIOM_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Run budgeted live evaluation
        shell: bash
        run: |
          test -n "$AXIOM_API_KEY"
          test -n "$AXIOM_LIVE_BASE_URL"
          test -n "$AXIOM_LIVE_MODEL"
          scripts/axiomcli-eval live
