name: AstreaAI verifier packages
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - 'scripts/*direct*'
      - 'deploy/astreaai-production.json'
      - 'vendor/axiom-direct-verifier/**'
      - '.github/workflows/direct-helpers.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: node --test scripts/direct-bundle.test.mjs
      - run: node scripts/build-direct-bundle.mjs --output .local/direct/bundle
      - run: tar -czf direct.tar.gz -C .local/direct/bundle ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: direct-${{ matrix.target }}
          path: direct.tar.gz
          retention-days: 7
          if-no-files-found: error
