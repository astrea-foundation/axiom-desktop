name: Chutes helper platform qualification
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - vendor/axiom-chutes-helper/**
      - scripts/build-chutes-bundle.mjs
      - apps/desktop/scripts/bundle-chutes-runtime.cjs
      - .github/workflows/chutes-helpers.yml
  pull_request:
    branches: [dev, main]
    paths:
      - vendor/axiom-chutes-helper/**
      - scripts/build-chutes-bundle.mjs
      - apps/desktop/scripts/bundle-chutes-runtime.cjs
      - .github/workflows/chutes-helpers.yml
permissions:
  contents: read
concurrency:
  group: chutes-helpers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Frozen helper (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-arm64, runner: macos-15, architecture: arm64}
          - {target: macos-x64, runner: macos-15-intel, architecture: x64}
          - {target: windows-x64, runner: windows-latest, architecture: x64}
          - {target: linux-x64, runner: ubuntu-22.04, architecture: x64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Build locked source, exercise native state, and validate the payload
        env:
          AXIOM_HELPER_PYTHON: python
        run: |
          node scripts/build-chutes-bundle.mjs --channel staging --output .local/chutes/bundle
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Verify the frozen helper through the real native stdin/stdout protocol
        env:
          AXIOM_CHUTES_BUNDLE_TEST_CONFIG_FILE: .local/chutes/bundle/native.json
        run: cargo test --locked -p axiom-secure-client frozen_helper_accepts_the_real_native_stdio_handshake_without_network -- --ignored
      - name: Archive the verified payload with executable modes preserved
        run: python -c "import tarfile; t=tarfile.open('helper.tar.gz','w:gz'); t.add('.local/chutes/bundle',arcname='bundle'); t.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: chutes-helper-${{ matrix.target }}
          path: helper.tar.gz
          retention-days: 7
  windows-arm64:
    name: Windows 11 Arm helper execution
    needs: native
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: chutes-helper-windows-x64
      - run: python -c "import tarfile; t=tarfile.open('helper.tar.gz'); t.extractall('relocated helper',filter='data')"
      - name: Execute the frozen helper under Windows x64 emulation
        shell: pwsh
        run: |
          & './relocated helper/bundle/runtime/axiom-chutes-helper.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen helper self test failed on Arm' }
          node -e "require('./apps/desktop/scripts/bundle-chutes-runtime.cjs').validateBundle('relocated helper/bundle',{platform:'win32',architecture:'arm64',channel:'staging'}).catch(e=>{console.error(e);process.exit(1)})"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Drive the x64 helper from the native Arm SDK
        env:
          AXIOM_CHUTES_BUNDLE_TEST_CONFIG_FILE: relocated helper/bundle/native.json
        run: cargo test --locked -p axiom-secure-client frozen_helper_accepts_the_real_native_stdio_handshake_without_network -- --ignored
  universal-mac:
    name: Universal Mac helper assembly
    needs: native
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: chutes-helper-macos-*
          path: native-inputs
      - run: |
          python -c "import tarfile,pathlib; [tarfile.open(p).extractall(p.parent,filter='data') for p in pathlib.Path('native-inputs').glob('*/helper.tar.gz')]"
          uv sync --project vendor/axiom-chutes-helper/providers/chutes --locked --no-default-groups --group bundle
          vendor/axiom-chutes-helper/providers/chutes/.venv/bin/python vendor/axiom-chutes-helper/scripts/combine_chutes_helpers.py --arm64 native-inputs/chutes-helper-macos-arm64/bundle --x64 native-inputs/chutes-helper-macos-x64/bundle --output .local/chutes/universal
          node -e "require('./apps/desktop/scripts/bundle-chutes-runtime.cjs').validateBundle('.local/chutes/universal',{platform:'darwin',architecture:'universal',channel:'staging'}).catch(e=>{console.error(e);process.exit(1)})"
          python -c "import tarfile; t=tarfile.open('universal-helper.tar.gz','w:gz'); t.add('.local/chutes/universal',arcname='bundle'); t.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: chutes-helper-macos-universal
          path: universal-helper.tar.gz
          retention-days: 7
  universal-mac-intel:
    name: Universal helper on Intel Mac
    needs: universal-mac
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chutes-helper-macos-universal
      - run: |
          tar -xzf universal-helper.tar.gz
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin ./bundle/runtime/axiom-chutes-helper --self-test
