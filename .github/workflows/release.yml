name: signed release artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  live-evaluation:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      AXIOM_API_KEY: ${{ secrets.AXIOM_EVAL_API_KEY }}
      AXIOM_LIVE_BASE_URL: ${{ secrets.AXIOM_EVAL_BASE_URL }}
      AXIOM_LIVE_MODEL: ${{ secrets.AXIOM_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a promoted release revision and matching product version
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node apps/desktop/scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" --check-only
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Require and run the budgeted live regression gate
        shell: bash
        run: |
          test -n "$AXIOM_API_KEY"
          test -n "$AXIOM_LIVE_BASE_URL"
          test -n "$AXIOM_LIVE_MODEL"
          scripts/axiomcli-eval live

  linux-x86-64:
    needs: live-evaluation
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap jq
      - name: Install pinned cargo-deny
        shell: bash
        run: cargo install cargo-deny --version "=$(tr -d '\r\n' < .cargo-deny-version)" --locked
      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.AXIOMCLI_RELEASE_GPG_KEY_BASE64 }}
        run: |
          test -n "$GPG_PRIVATE_KEY_BASE64"
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
      - name: Build reproducible signed package
        env:
          AXIOMCLI_SIGNING_KEY: ${{ secrets.AXIOMCLI_RELEASE_GPG_FINGERPRINT }}
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          scripts/package-release --sign
          scripts/verify-release dist/*.tar.gz dist/*.tar.gz.asc
      - uses: actions/upload-artifact@v4
        with:
          name: axiomcli-linux-x86-64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.asc
          if-no-files-found: error

  macos-desktop:
    name: signed Desktop (${{ matrix.name }})
    needs: live-evaluation
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            arch: x64
            binary_arch: x86_64
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            binary_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set Desktop version from the release tag
        shell: bash
        run: node apps/desktop/scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - run: cargo test -p axiom-acp-extension -p axiomcli --all-features
      - run: pnpm typecheck && pnpm test
      - run: cargo build --release -p axiomcli
      - name: Build, sign, and notarize Desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          pnpm --filter axiom-desktop dist -- --mac --${{ matrix.arch }} --publish never
      - name: Verify packaged identity, architecture, signatures, and notarization
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          dist=apps/desktop/dist
          expected_stem="Axiom-${version}-mac-${{ matrix.arch }}"

          shopt -s nullglob
          dmgs=("$dist"/*.dmg)
          zips=("$dist"/*.zip)
          blockmaps=("$dist"/*.blockmap)
          if (( ${#dmgs[@]} != 1 )) || [[ ${dmgs[0]} != "$dist/$expected_stem.dmg" ]]; then
            echo "expected exactly $expected_stem.dmg; found ${dmgs[*]:-none}" >&2
            exit 1
          fi
          if (( ${#zips[@]} != 1 )) || [[ ${zips[0]} != "$dist/$expected_stem.zip" ]]; then
            echo "expected exactly $expected_stem.zip; found ${zips[*]:-none}" >&2
            exit 1
          fi
          if (( ${#blockmaps[@]} != 2 )) ||
             [[ ! -f "$dist/$expected_stem.dmg.blockmap" ]] ||
             [[ ! -f "$dist/$expected_stem.zip.blockmap" ]]; then
            echo "expected exactly the DMG and ZIP blockmaps; found ${blockmaps[*]:-none}" >&2
            exit 1
          fi

          app_paths=()
          while IFS= read -r -d '' candidate; do
            app_paths+=("$candidate")
          done < <(find "$dist" -type d -name Axiom.app -prune -print0)
          if (( ${#app_paths[@]} != 1 )); then
            echo "expected exactly one unpacked Axiom.app; found ${#app_paths[@]}" >&2
            exit 1
          fi
          app_path=${app_paths[0]}
          plist="$app_path/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$version"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          app_executable="$app_path/Contents/MacOS/$executable_name"
          sidecar="$app_path/Contents/Resources/bin/axiomcli"
          test -x "$app_executable"
          test -x "$sidecar"
          test "$(lipo -archs "$app_executable")" = "${{ matrix.binary_arch }}"
          test "$(lipo -archs "$sidecar")" = "${{ matrix.binary_arch }}"
          test "$("$sidecar" --version)" = "axiomcli $version"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$app_executable"
          codesign --verify --strict --verbose=2 "$sidecar"
          zip_listing=$(unzip -Z1 "${zips[0]}")
          grep -Fx 'Axiom.app/Contents/Resources/bin/axiomcli' <<<"$zip_listing"
          hdiutil verify "${dmgs[0]}"
          codesign --verify --strict --verbose=2 "${dmgs[0]}"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmgs[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  windows-desktop:
    name: signed Desktop (${{ matrix.name }})
    needs: live-evaluation
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            arch: x64
            pe_machine: "0x8664"
          - name: Windows ARM64
            runner: windows-11-arm
            arch: arm64
            pe_machine: "0xAA64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set Desktop version from the release tag
        shell: bash
        run: node apps/desktop/scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
      - run: cargo test -p axiom-acp-extension -p axiomcli --all-features
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo build --release -p axiomcli
      - name: Build and Authenticode-sign Desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { throw "WINDOWS_CERTIFICATE_BASE64 is required" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }
          pnpm --filter axiom-desktop dist -- --win --${{ matrix.arch }} --publish never
      - name: Verify packaged identity, architecture, and Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dist = (Resolve-Path "apps/desktop/dist").Path
          $expectedInstaller = Join-Path $dist "Axiom-$version-win-${{ matrix.arch }}.exe"

          $installers = @(Get-ChildItem -LiteralPath $dist -File -Filter "*.exe")
          if ($installers.Count -ne 1 -or $installers[0].FullName -ne $expectedInstaller) {
            throw "Expected exactly $expectedInstaller; found $($installers.FullName -join ', ')"
          }
          $expectedBlockmap = "$expectedInstaller.blockmap"
          $blockmaps = @(Get-ChildItem -LiteralPath $dist -File -Filter "*.blockmap")
          if ($blockmaps.Count -ne 1 -or $blockmaps[0].FullName -ne $expectedBlockmap) {
            throw "Expected exactly $expectedBlockmap; found $($blockmaps.FullName -join ', ')"
          }
          $apps = @(Get-ChildItem -LiteralPath $dist -Recurse -File -Filter "Axiom.exe")
          if ($apps.Count -ne 1) {
            throw "Expected exactly one unpacked Axiom.exe; found $($apps.Count)"
          }
          $app = $apps[0]
          $sidecar = Join-Path $app.Directory.FullName "resources\bin\axiomcli.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Packaged AxiomCLI sidecar is missing: $sidecar"
          }

          function Get-PeMachine([string] $Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            $reader = [System.IO.BinaryReader]::new($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Not a PE executable: $Path" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0 -or $peOffset + 6 -gt $stream.Length) {
                throw "Invalid PE header offset: $Path"
              }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature: $Path" }
              return "0x{0:X4}" -f $reader.ReadUInt16()
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          foreach ($binary in @($app.FullName, $sidecar)) {
            $machine = Get-PeMachine $binary
            if ($machine -ne "${{ matrix.pe_machine }}") {
              throw "Expected $binary to be ${{ matrix.pe_machine }}; found $machine"
            }
          }

          $versionParts = $version.Split('.')
          foreach ($versionedBinary in @($expectedInstaller, $app.FullName)) {
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($versionedBinary)
            if ($info.ProductMajorPart -ne [int]$versionParts[0] -or
                $info.ProductMinorPart -ne [int]$versionParts[1] -or
                $info.ProductBuildPart -ne [int]$versionParts[2] -or
                $info.ProductPrivatePart -ne 0) {
              throw "Expected $versionedBinary product version $version.0; found $($info.ProductVersion)"
            }
          }

          $sidecarVersion = (& $sidecar --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $sidecarVersion -ne "axiomcli $version") {
            throw "Expected packaged sidecar version axiomcli $version; found $sidecarVersion"
          }

          foreach ($signedBinary in @($expectedInstaller, $app.FullName, $sidecar)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $signedBinary
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode status for ${signedBinary}: $($signature.Status)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-desktop-windows-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
