name: desktop installers

on:
  push:
    branches: ['codex/desktop-packaging-*']
  workflow_dispatch:
    inputs:
      unsigned:
        description: Build the explicitly unsigned early-access installers
        type: boolean
        default: true
      platform:
        description: Platforms to package (Windows-only supports installer iteration)
        type: choice
        default: all
        options: [all, windows]

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform == 'windows' &&
            '[{"platform":"win","arch":"x64","runner":"windows-latest"},{"platform":"win","arch":"arm64","runner":"windows-11-arm"}]' ||
            '[{"platform":"linux","arch":"x64","runner":"ubuntu-22.04"},{"platform":"mac","arch":"x64","runner":"macos-15-intel"},{"platform":"mac","arch":"arm64","runner":"macos-15"},{"platform":"win","arch":"x64","runner":"windows-latest"},{"platform":"win","arch":"arm64","runner":"windows-11-arm"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config libgtk-3-0 libnss3 libasound2 bubblewrap libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter axiom-desktop typecheck
      - run: pnpm --filter axiom-desktop exec tsx --test tests/packaging.test.ts tests/release-version.test.ts
      - uses: actions/cache/restore@v4
        id: cli-cache
        with:
          path: |
            target/release/axiomcli
            target/release/axiomcli.exe
          key: native-cli-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain*', 'apps/axiomcli/**', 'crates/**', 'protocol/**', 'fixtures/**') }}
      - run: cargo build --locked --release -p axiomcli
        if: steps.cli-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v4
        if: steps.cli-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target/release/axiomcli
            target/release/axiomcli.exe
          key: ${{ steps.cli-cache.outputs.cache-primary-key }}
      - name: Package desktop and CLI
        shell: bash
        env:
          UNSIGNED: ${{ github.event_name == 'push' || inputs.unsigned }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--${{ matrix.platform }} --${{ matrix.arch }})
          if [[ "$UNSIGNED" == true ]]; then args+=(--unsigned); fi
          node apps/desktop/scripts/package-desktop.mjs "${args[@]}"
      - name: Verify Linux package contents and CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=(apps/desktop/dist/*.AppImage)
          "${appimage[0]}" --appimage-extract > /dev/null
          squashfs-root/AppRun --axiom-cli --version
          squashfs-root/AppRun --axiom-cli --help
          deb=(apps/desktop/dist/*.deb)
          dpkg-deb --field "${deb[0]}" Package Version Architecture
          sudo apt-get install -y "$(realpath "${deb[0]}")"
          axiomcli --version
          axiomcli --help
          test "$(command -v axiomcli)" = /usr/bin/axiomcli
          sudo apt-get install --reinstall -y "$(realpath "${deb[0]}")"
          axiomcli --version
          arch=(apps/desktop/dist/*.pkg.tar.xz)
          tar -tf "${arch[0]}" | grep -E '^\.?/?usr/bin/axiomcli$'
          tar -xOf "${arch[0]}" .PKGINFO
      - name: Verify desktop and CLI dependencies on minimal Linux installations
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          docker run --rm -v "$PWD/apps/desktop/dist:/install:ro" ubuntu:22.04 sh -ec '
            (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /install/*.deb) >/tmp/install.log 2>&1 || { tail -n 50 /tmp/install.log; exit 1; }
            axiomcli --version
            ELECTRON_RUN_AS_NODE=1 /opt/Axiom/axiom-desktop -p process.versions.electron
          '
          docker run --rm -v "$PWD/apps/desktop/dist:/install:ro" archlinux:base sh -ec '
            (pacman -Syu --noconfirm && pacman -U --noconfirm /install/*.pkg.tar.xz) >/tmp/install.log 2>&1 || { tail -n 50 /tmp/install.log; exit 1; }
            axiomcli --version
            ELECTRON_RUN_AS_NODE=1 /opt/Axiom/axiom-desktop -p process.versions.electron
          '
      - name: Verify macOS installation and CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg=(apps/desktop/dist/Axiom-*-mac-*.pkg)
          sudo installer -pkg "${pkg[0]}" -target /
          /usr/local/bin/axiomcli --version
          /usr/local/bin/axiomcli --help
          test "$(readlink /usr/local/bin/axiomcli)" = /Applications/Axiom.app/Contents/Resources/bin/axiomcli
          codesign --verify --deep --strict /Applications/Axiom.app
          marker="$HOME/Library/Application Support/axiom/accounts/packaging-smoke/desktop/preserved.txt"
          mkdir -p "$(dirname "$marker")"
          printf '%s' preserved > "$marker"
          sudo installer -pkg "${pkg[0]}" -target /
          /usr/local/bin/axiomcli --version
          test "$(cat "$marker")" = preserved
      - name: Verify Windows installation and CLI PATH
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem apps/desktop/dist/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          function Read-UserPath {
            $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            try { return [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) }
            finally { $key.Dispose() }
          }
          $originalUserPath = Read-UserPath
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Axiom'
          $install = Start-Process $installer[0].FullName -ArgumentList '/S', '/currentuser', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $unpackedName = if ('${{ matrix.arch }}' -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          $unpacked = (Resolve-Path (Join-Path 'apps/desktop/dist' $unpackedName)).Path
          $nativeFiles = @(Get-ChildItem $unpacked -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.node' })
          if ($nativeFiles.Count -lt 3) { throw 'Expected packaged desktop and native libraries' }
          foreach ($file in $nativeFiles) {
            $relative = [IO.Path]::GetRelativePath($unpacked, $file.FullName)
            $installed = Join-Path $installDir $relative
            if (-not (Test-Path -LiteralPath $installed)) { throw "Installer omitted native file: $relative" }
            if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) { throw "Installed native file differs: $relative" }
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          if (-not (Test-Path (Join-Path $installDir 'resources\bin\vcruntime140.dll'))) { throw 'Bundled Visual C++ runtime is missing' }
          axiomcli --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          axiomcli --help
          $data = Join-Path $env:LOCALAPPDATA 'axiom\accounts\packaging-smoke\desktop'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'preserved.txt') 'preserved'
          $install = Start-Process $installer[0].FullName -ArgumentList '/S', '/currentuser', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Reinstallation failed' }
          $bin = Join-Path $installDir 'resources\bin'
          $matches = @(([Environment]::GetEnvironmentVariable('Path','User') -split ';') | Where-Object { $_ -ieq $bin })
          if ($matches.Count -ne 1) { throw 'CLI PATH must have exactly one entry after reinstall' }
          axiomcli --version
          $uninstaller = @(Get-ChildItem $installDir -Filter 'Uninstall*.exe')
          if ($uninstaller.Count -ne 1) { throw 'Expected one uninstaller' }
          $removed = Start-Process $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Uninstall failed' }
          $remaining = @(([Environment]::GetEnvironmentVariable('Path','User') -split ';') | Where-Object { $_ -ieq $bin })
          if ($remaining.Count -ne 0) { throw 'Uninstall left a CLI PATH entry behind' }
          if ((Read-UserPath) -cne $originalUserPath) { throw 'Install/uninstall changed unrelated PATH entries' }
          if ((Get-Content (Join-Path $data 'preserved.txt')).Trim() -ne 'preserved') { throw 'Uninstall modified account data' }
      - name: Generate download metadata
        shell: bash
        env:
          UNSIGNED: ${{ github.event_name == 'push' || inputs.unsigned }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          signing=signed
          if [[ "$UNSIGNED" == true ]]; then signing=unsigned; fi
          node scripts/download-manifest.mjs apps/desktop/dist "$version" "$signing"
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.pkg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.pkg.tar.xz
            apps/desktop/dist/manifest.json
            apps/desktop/dist/SHA256SUMS
      - name: Retain installer for failed-install diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: axiom-installer-debug-${{ matrix.arch }}
          if-no-files-found: ignore
          path: apps/desktop/dist/*.exe
