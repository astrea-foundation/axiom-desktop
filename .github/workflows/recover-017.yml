name: Complete v0.1.7 installation verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One-time verification of retained signed artifacts. No compilation or signing
# repeats; the promoted test fix only handles temporary Windows file locks.
jobs:
  verify-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 10
    environment: windows-signing
    env:
      AXIOM_UPDATE_PUBLIC_KEYS: ${{ vars.AXIOM_UPDATE_PUBLIC_KEYS }}
      AXIOM_SIGNING_PUBLISHER: ${{ vars.AXIOM_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require promoted verification repair and signed input provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/v0.1.7-packaging.3
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse v0.1.7^{commit})" = 5239e315f86809e1a95b4954eae4a27a34c0fa8b
          python - <<'PYTHON'
          import json, subprocess
          allowed = {'apps/desktop/scripts/after-pack.cjs', 'apps/desktop/tests/windows-signing.test.ts', 'apps/desktop/scripts/verify-windows-install.ps1', '.github/workflows/recover-017.yml', '.github/workflows/release.yml', 'docs/releasing.md'}
          changed = set(subprocess.check_output(['git','diff','--name-only','v0.1.7','HEAD'], text=True).splitlines())
          if not changed <= allowed: raise SystemExit(f'Product source changed: {changed - allowed}')
          run = json.loads(subprocess.check_output(['gh','api','repos/astrea-foundation/axiomai/actions/runs/35807400501'], text=True))
          if run['head_sha'] != '51837f25a80cdf60074aff9f263b6f3fcb92ceca' or run['path'] != '.github/workflows/recover-017.yml': raise SystemExit('Unexpected signed artifact source')
          jobs = json.loads(subprocess.check_output(['gh','api','repos/astrea-foundation/axiomai/actions/runs/35807400501/jobs'], text=True))['jobs']
          if not any(job['name'] == 'sign' and job['conclusion'] == 'success' for job in jobs): raise SystemExit('Signed x64 installation checks did not pass')
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: axiom-release-win-universal
          path: installers
          run-id: 35807400501
          github-token: ${{ github.token }}
      - shell: pwsh
        run: ./apps/desktop/scripts/verify-windows-install.ps1 -Installers installers -Version 0.1.7 -Arch arm64 -Publisher $env:AXIOM_SIGNING_PUBLISHER

  publish:
    needs: verify-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      AXIOM_UPDATE_PUBLIC_KEYS: ${{ vars.AXIOM_UPDATE_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: axiom-release-*
          path: release
          merge-multiple: true
          run-id: 35803134333
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: axiom-release-win-universal
          path: release
          run-id: 35807400501
          github-token: ${{ github.token }}
      - name: Sign the complete final-byte inventory
        env:
          AXIOM_UPDATE_SIGNING_KEY: ${{ secrets.AXIOM_UPDATE_SIGNING_KEY }}
        run: node scripts/download-manifest.mjs release 0.1.7 signed
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-signed-release
          path: release/
          retention-days: 7
          if-no-files-found: error
      - name: Publish source repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.mjs release --source
