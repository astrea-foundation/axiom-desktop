[package]
name = "axiom-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
axiom-inference = { version = "0.1.0", path = "../crates/axiom-inference" }
axiom-openai-compat = { version = "0.1.0", path = "../crates/axiom-openai-compat" }
axiom-secure-client = { version = "0.1.0", path = "../crates/axiom-secure-client", features = ["fuzzing"] }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"

[[bin]]
name = "ciphertext"
path = "fuzz_targets/ciphertext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evidence"
path = "fuzz_targets/evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_request"
path = "fuzz_targets/openai_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_fragments"
path = "fuzz_targets/tool_fragments.rs"
test = false
doc = false
bench = false
