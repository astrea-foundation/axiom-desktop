# AxiomCLI development SearXNG configuration. This is a real metasearch
# service, bound to loopback and intentionally not suitable for public hosting.
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - wikipedia

general:
  debug: false
  instance_name: "AxiomCLI Development Search"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  port: 8888
  bind_address: "127.0.0.1"
  secret_key: "axiomcli-development-only-not-for-public-hosting"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0

ui:
  static_use_hash: true
