use_default_settings:
  engines:
    keep_only:
      - duckduckgo

general:
  debug: false
  instance_name: "AxiomCLI Timeout Search Fixture"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  formats: [html, json]

server:
  bind_address: "127.0.0.1"
  secret_key: "axiomcli-development-timeout-fixture"
  limiter: false
  public_instance: false

outgoing:
  request_timeout: 0.1
  max_request_timeout: 0.2

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
    timeout: 0.1
    ddg_url: "https://httpbin.org/delay/2"
