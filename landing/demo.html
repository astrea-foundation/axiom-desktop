<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AxiomAI desktop demo</title>
<link rel="icon" type="image/svg+xml" href="assets/axiom-symbol-logo-colored.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'PP Cirka';
    src: url('fonts/PPCirka-Regular.otf') format('opentype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  html, body { margin:0; padding:0; background:transparent; font-family:'DM Sans',-apple-system,sans-serif; }
</style>
</head>
<body>
<!-- ================================================================
     ▼▼▼  AXIOM DESKTOP — SELF-CONTAINED DEMO. COPY FROM HERE.  ▼▼▼
     A non-interactive replica of the desktop app's light theme: the
     gradient canvas, the transparent sidebar, the floating stage card,
     the composer, the welcome greeting and the chat thread. It plays the
     same three-turn conversation on a loop. Sizes itself to its parent
     (CSS container queries). Respects prefers-reduced-motion and pauses
     when scrolled out of view.
     ================================================================ -->

<div class="ax-home" data-ax-home>
  <div class="ax-shell">

    <!-- ============ sidebar (transparent, on the canvas) ============ -->
    <aside class="ax-side">
      <div class="ax-side-top">
        <!-- the Axiom mark sits where macOS would draw the traffic lights -->
        <img class="ax-brand" src="assets/axiom-ai-colored-logo.svg" alt="AxiomAI" draggable="false">
        <span class="ax-ibtn" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
        </span>
      </div>

      <nav class="ax-nav">
        <div class="ax-nav-group">
          <div class="ax-nav-row">
            <span class="ax-plus-ring"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
            <span>New thread</span>
          </div>
          <div class="ax-nav-row">
            <span class="ax-nav-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></span>
            <span>Proxy</span>
          </div>
        </div>
        <div class="ax-search-row">
          <div class="ax-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <span class="ax-search-ph">Search threads</span>
          </div>
          <span class="ax-ibtn ax-ibtn-lg" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </span>
        </div>
      </nav>

      <div class="ax-threads">
        <div class="ax-label">Threads</div>

        <div class="ax-folder">
          <div class="ax-folder-head">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            <svg class="ax-folder-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span>Fundraise</span>
          </div>
          <div class="ax-folder-kids">
            <div class="ax-trow ax-nested"><i class="ax-tdot"></i><span>Series B model</span></div>
            <div class="ax-trow ax-nested"><i class="ax-tdot"></i><span>Runway scenarios</span></div>
          </div>
        </div>

        <div class="ax-loose">
          <div class="ax-trow" data-ax-thread-row><i class="ax-tdot"></i><span>Board memo</span></div>
          <div class="ax-trow"><i class="ax-tdot"></i><span>Reading notes</span></div>
        </div>
      </div>

      <div class="ax-account">
        <div class="ax-account-row">
          <span class="ax-avatar">AL</span>
          <span class="ax-account-text">
            <span class="ax-account-name">Ada Lindqvist</span>
            <span class="ax-account-sub">Private account</span>
          </span>
          <svg class="ax-gear" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </aside>

    <!-- ============ the stage: a floating translucent card ============ -->
    <div class="ax-stage-frame">
      <section class="ax-stage-card">

        <header class="ax-title">
          <img class="ax-title-brand" src="assets/axiom-ai-colored-logo.svg" alt="AxiomAI" draggable="false">
          <span class="ax-title-text" data-ax-title>New thread</span>
          <span class="ax-title-more" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </span>
        </header>

        <div class="ax-view" data-ax-view>

          <!-- welcome blooms: soft white shapes on a fixed 2000×1400 composition -->
          <div class="ax-blooms" aria-hidden="true">
            <div class="ax-bloom-stage">
              <div class="ax-blob" style="left:120px; top:250px; width:780px; height:640px; border-radius:62% 38% 55% 45% / 48% 57% 43% 52%; transform:rotate(-14deg)"></div>
              <div class="ax-blob" style="left:1190px; top:130px; width:720px; height:560px; border-radius:41% 59% 47% 53% / 62% 36% 64% 38%; transform:rotate(23deg); opacity:.8"></div>
              <div class="ax-blob" style="left:640px; top:830px; width:900px; height:620px; border-radius:56% 44% 63% 37% / 39% 55% 45% 61%; transform:rotate(8deg); opacity:.7"></div>
            </div>
          </div>

          <!-- the thread -->
          <div class="ax-scroller" data-ax-scroller>
            <div class="ax-thread" data-ax-thread></div>
          </div>

          <!-- the dock: greeting + composer + trust strip. Centred on the
               welcome screen, then it settles to the bottom of the card. -->
          <div class="ax-dock" data-ax-dock>
            <div class="ax-dock-inner">

              <div class="ax-head" data-ax-head>
                <img class="ax-mark" src="assets/axiom-symbol-logo-colored.svg" alt="" draggable="false">
                <h1 class="ax-greet" data-ax-greet aria-label="A quiet place to think."><span class="unmask unmask-word" aria-hidden="true"><span class="unmask-inner" style="--ld:.08s">A&nbsp;</span></span><span class="unmask unmask-word" aria-hidden="true"><span class="unmask-inner" style="--ld:.15s">quiet&nbsp;</span></span><span class="unmask unmask-word" aria-hidden="true"><span class="unmask-inner" style="--ld:.22s">place&nbsp;</span></span><span class="unmask unmask-word" aria-hidden="true"><span class="unmask-inner" style="--ld:.29s">to&nbsp;</span></span><span class="unmask unmask-word" aria-hidden="true"><span class="unmask-inner" style="--ld:.36s">think.</span></span></h1>
              </div>

              <div class="ax-composer" data-ax-composer>
                <div class="ax-c-row">
                  <svg class="ax-c-lock" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <div class="ax-input">
                    <span class="ax-ph" data-ax-ph>Ask anything</span>
                    <span class="ax-typed" data-ax-typed></span><i class="ax-caret" data-ax-caret></i>
                  </div>
                </div>
                <div class="ax-c-bar">
                  <div class="ax-c-left">
                    <span class="ax-cchip">
                      <svg class="ax-brand-mono" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M12.105 2L9.927 4.953H.653L2.83 2h9.276zM23.254 19.048L21.078 22h-9.242l2.174-2.952h9.244zM24 2L9.264 22H0L14.736 2H24z"/></svg>
                      <span>GLM 5.2</span>
                      <svg class="ax-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </span>
                    <span class="ax-cchip ax-cchip-reason">
                      <svg class="ax-brain" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.852 14.772-.383.923"/><path d="m10.852 9.228-.383-.923"/><path d="m13.148 14.772.382.924"/><path d="m13.531 8.305-.383.923"/><path d="m14.772 10.852.923-.383"/><path d="m14.772 13.148.923.383"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 0 0-5.63-1.446 3 3 0 0 0-.368 1.571 4 4 0 0 0-2.525 5.771"/><path d="M17.998 5.125a4 4 0 0 1 2.525 5.771"/><path d="M19.505 10.294a4 4 0 0 1-1.5 7.706"/><path d="M4.032 17.483A4 4 0 0 0 11.464 20c.18-.311.892-.311 1.072 0a4 4 0 0 0 7.432-2.516"/><path d="M4.5 10.291A4 4 0 0 0 6 18"/><path d="M6.002 5.125a3 3 0 0 0 .4 1.375"/><path d="m9.228 10.852-.923-.383"/><path d="m9.228 13.148-.923.383"/><circle cx="12" cy="12" r="3"/></svg>
                      <span class="ax-hide-sm">Medium</span>
                      <svg class="ax-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </span>
                  </div>
                  <div class="ax-c-right">
                    <span class="ax-tee">
                      <span class="ax-tee-ico">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="#3f9b46" stroke="none" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                        <svg class="ax-tee-check" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                      </span>
                      <span>TEE verified</span>
                    </span>
                    <span class="ax-kbd ax-hide-sm" aria-hidden="true">⌘↵</span>
                    <div class="ax-send" data-ax-send>
                      <svg class="ax-i-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                      <svg class="ax-i-stop" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                    </div>
                  </div>
                </div>
              </div>

              <div class="ax-trust" data-ax-trust>
                <span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                  Sealed on your machine
                </span>
                <span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
                  Attested enclave
                </span>
                <span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                  0 bytes plaintext out
                </span>
              </div>

            </div>
          </div>
        </div>

      </section>
    </div>
  </div>
</div>

<style>
/* ---------- scope + tokens (the desktop app's light theme) ---------- */
.ax-home{
  container-type: inline-size;
  container-name: axhome;
  width:100%;

  --ink:#101014;
  --ink-2:#56565f;
  --ink-3:#84848e;
  --ink-4:#a6a6af;
  --brand:#ff7653;
  --success:#3f9b46;

  --surface-stage:rgba(255,255,255,.72);
  --surface-bubble:rgba(255,255,255,.82);
  --surface-glass:rgba(255,255,255,.72);
  --surface-glass-focus:rgba(255,255,255,.8);
  --wash-chip:rgba(16,16,20,.045);
  --wash-row:rgba(16,16,20,.025);
  --ring-hairline:rgba(16,16,20,.045);
  --ring-accent:rgba(16,16,20,.3);
  --ring-halo:rgba(16,16,20,.06);
  --shade-xs:rgba(16,16,20,.03);
  --shade-soft:rgba(16,16,20,.06);
  --shade-button:rgba(16,16,20,.24);
  --glass-inset:rgba(255,255,255,.85);
  --glass-inset-strong:rgba(255,255,255,.9);
  --dot-idle:#c9c9ce;
  --ease-out-expo:cubic-bezier(.16,1,.3,1);

  --ax-r:26px;
  --ax-shell-h:740px;
  --ax-greet:56px;
  --ax-dock-shift:0px;

  font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-optical-sizing:auto;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  letter-spacing:-0.011em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.ax-home *, .ax-home *::before, .ax-home *::after{ box-sizing:border-box; }
.ax-home svg{ display:block; flex:0 0 auto; }

/* the canvas: the app window's frosted gradient ground */
.ax-shell{
  display:flex; align-items:stretch;
  height:var(--ax-shell-h);
  padding:10px;
  border-radius:var(--ax-r);
  overflow:hidden;
  background:
    radial-gradient(1200px 700px at 12% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
    radial-gradient(900px 620px at 88% 4%, #f4f3f6 0%, rgba(244,243,246,0) 60%),
    radial-gradient(1100px 900px at 70% 92%, #edecef 0%, rgba(237,236,239,0) 65%),
    linear-gradient(168deg, #f7f7f8 0%, #edecef 48%, #e8e7eb 100%);
}

/* ---------- sidebar ---------- */
.ax-side{
  display:none; flex:0 0 260px; flex-direction:column;
  width:260px; min-height:0;
  background:transparent;
}
.ax-side-top{
  display:flex; align-items:center; justify-content:space-between;
  height:40px; flex:0 0 auto;
  padding:0 8px 0 14px;
}
.ax-brand{ height:18px; width:auto; display:block; }
.ax-ibtn{
  display:flex; align-items:center; justify-content:center;
  width:28px; height:28px; border-radius:8px; color:var(--ink-3);
}
.ax-ibtn-lg{ width:32px; height:32px; border-radius:10px; }

.ax-nav{ display:flex; flex-direction:column; gap:10px; padding:4px 12px 8px; flex:0 0 auto; }
.ax-nav-group{ display:flex; flex-direction:column; gap:2px; }
.ax-nav-row{
  display:flex; align-items:center; gap:8px;
  height:32px; width:100%; border-radius:9px;
  font-size:13px; color:var(--ink-2);
}
.ax-plus-ring{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:15px; height:15px; border-radius:50%; border:1px solid currentColor;
}
.ax-nav-ico{ display:flex; align-items:center; justify-content:center; width:15px; height:15px; flex:0 0 auto; }
.ax-search-row{ display:flex; align-items:center; gap:4px; }
.ax-search{
  display:flex; align-items:center; gap:8px; flex:1 1 auto; min-width:0;
  padding:6px 10px; border-radius:8px;
  border:1px solid rgba(16,16,20,.08); background:#f7f7f8;
  color:var(--ink-3);
}
.ax-search-ph{ font-size:13px; line-height:1.5; color:var(--ink-4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.ax-threads{ flex:1 1 auto; min-height:0; overflow:hidden; padding:12px 12px 8px; }
.ax-label{
  padding:0 8px 8px;
  font-size:10.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  line-height:1.5; color:var(--ink-3);
}
.ax-folder{ border-radius:10px; }
.ax-folder-head{
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:10px;
  font-size:12.5px; line-height:1.5; color:var(--ink-2);
}
.ax-folder-ico{ color:var(--ink-3); }
.ax-folder-kids{ margin-left:12px; padding:0 0 4px 4px; }
.ax-loose{ display:flex; flex-direction:column; gap:2px; border-radius:10px; }
.ax-trow{
  display:flex; align-items:center; gap:8px;
  height:32px; width:100%; padding-left:8px; border-radius:9px;
  font-size:13px; color:var(--ink-2);
  transition:background-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.ax-trow.ax-nested{ padding-left:16px; }
.ax-trow > span{ min-width:0; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ax-trow.ax-on{
  background:#ffffff; color:var(--ink);
  box-shadow:0 0 0 1px rgba(16,16,20,.04), 0 1px 1px rgba(16,16,20,.02), inset 0 1px 0 rgba(255,255,255,.7);
}
.ax-tdot{ width:6px; height:6px; border-radius:50%; background:var(--dot-idle); flex:0 0 auto; display:block; }
/* the active thread's dot breathes brand while a reply is being generated */
.ax-tdot.ax-working{ animation:ax-dot-working 1.8s ease-in-out infinite; }
@keyframes ax-dot-working{ 0%,100%{ background:var(--dot-idle); } 50%{ background:var(--brand); } }

.ax-account{ padding:8px; flex:0 0 auto; }
.ax-account-row{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:10px; }
.ax-avatar{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:28px; height:28px; border-radius:50%;
  background:var(--ink); color:#fff; font-size:11px; font-weight:600;
}
.ax-account-text{ display:flex; flex-direction:column; align-items:flex-start; flex:1 1 auto; min-width:0; line-height:1.25; }
.ax-account-name{ font-size:12.5px; color:var(--ink); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ax-account-sub{ font-size:11px; color:var(--ink-3); }
.ax-gear{ color:var(--ink-3); margin-right:4px; }

/* ---------- the stage card ---------- */
.ax-stage-frame{ position:relative; flex:1 1 auto; min-width:0; }
.ax-stage-frame::before{
  content:""; position:absolute; inset:0; border-radius:22px; pointer-events:none;
  box-shadow:
    inset 0 0 0 1px var(--ring-hairline),
    0 1px 1px rgba(16,16,20,.03),
    0 12px 26px -14px rgba(16,16,20,.12);
}
.ax-stage-card{
  position:absolute; inset:1px;
  display:flex; flex-direction:column;
  border-radius:21px; overflow:hidden;
  background:var(--surface-stage);
  box-shadow:inset 0 1px 0 var(--glass-inset);
}

.ax-title{
  position:absolute; left:0; right:0; top:0; z-index:30;
  display:flex; align-items:center; gap:8px;

      }
    }

    async function scrambleTo(node, finalText, rounds) {
      for (var r = 0; r < rounds; r++) {
        if (state.dead) return;
        await gate();
        node.textContent = randHex(6);
        await sleep(65);
      }
      node.textContent = finalText;
    }

    /* the textarea keeps focus after a send, as in the app: the ring and
       the caret stay; only the text and the send state clear */
    function clearComposer() {
      typed.textContent = '';
      ph.classList.remove('ax-off');
      send.classList.remove('ax-ready');
    }

    function reset() {
      // every transition is suspended while this runs: the view is faded
      // out, so the welcome state is rebuilt and measured instantly
      root.classList.add('ax-snap-all');
      while (thread.firstChild) thread.removeChild(thread.firstChild);
      state.live = false;
      root.classList.remove('ax-live');
      if (threadRow) threadRow.classList.remove('ax-on');
      setWorking(false);
      send.classList.remove('ax-stop');
      if (title) title.textContent = NEW_TITLE;
      if (greet) greet.classList.remove('unmask-in');
      clearComposer();
      scroller.scrollTop = 0;
      void view.offsetHeight;           // the head and strip are back at full height
      layoutDock();
      void view.offsetHeight;
      root.classList.remove('ax-snap-all');
    }

    // Static final state for reduced motion — no loop, no typing.
    function renderStatic() {
      goLive();
      if (greet) greet.classList.add('unmask-in');
      TURNS.forEach(function (t) {
        addUser(t.user).textContent = 'Sealed · ' + t.size + ' · ' + t.cipher.slice(0, 9) + '…';
        var ai = addAITurn();
        startAnswer(ai).textContent = t.reply;
        addProof(ai, t.proof);
      });
      toBottom();
      // the faces arrive after the first layout, and the host may resize
      // the frame later; keep the end of the thread in view either way
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(toBottom);
      setTimeout(toBottom, 600);
      if ('ResizeObserver' in window) new ResizeObserver(toBottom).observe(view);
    }

    async function loop() {
      /* eslint no-constant-condition: 0 */
      while (!state.dead) {
        await gate();
        await sleep(1400);

        for (var i = 0; i < TURNS.length; i++) {
          var t = TURNS[i];
          if (state.dead) return;

          // the welcome composer is focused, as in the app
          composer.classList.add('ax-focus');
          await typeInto(typed, t.user, 26);
          await sleep(420);

          // fire
          send.classList.add('ax-fire');
          setTimeout(function () { send.classList.remove('ax-fire'); }, 190);

          goLive();
          clearComposer();
          send.classList.add('ax-stop');       // the circle becomes Stop while it works
          setWorking(true);

          var sealNode = addUser(t.user);
          await scrambleTo(sealNode, 'Sealed · ' + t.size + ' · ' + t.cipher.slice(0, 9) + '…', 9);

          await sleep(360);
          var ai = addAITurn();
          await sleep(950);

          var answer = startAnswer(ai);
          await streamInto(answer, t.reply, 46);

          addProof(ai, t.proof);
          send.classList.remove('ax-stop');
          setWorking(false);
          toBottom();

          await sleep(i === TURNS.length - 1 ? 3400 : 2300);
        }

        // fade out and start over from the welcome screen; the title and
        // the sidebar highlight sit outside the fading view, so they
        // cross-fade now rather than snapping after it
        view.classList.add('ax-out');
        setTitle(NEW_TITLE);
        if (threadRow) threadRow.classList.remove('ax-on');
        await sleep(600);
        reset();
        await sleep(60);
        view.classList.remove('ax-out');
        riseGreeting();
        await sleep(700);
      }
    }

    // the welcome composer is autofocused in the app: ring on, caret blinking
    composer.classList.add('ax-focus');
    caret.classList.add('ax-blink');
    layoutDock();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!state.live) layoutDock(); });
    setTimeout(function () { if (!state.live) layoutDock(); }, 400);

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { renderStatic(); }
    else { riseGreeting(); loop(); }
  }

  function init() {
    document.querySelectorAll('[data-ax-home]').forEach(boot);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
