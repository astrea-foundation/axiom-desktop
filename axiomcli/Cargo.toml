[package]
name = "axiomcli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.31"
git2 = "0.21.0"
globset = "0.4.20"
ignore = "0.4.33"
nix = { version = "0.31.3", features = ["process", "signal"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "server", "transport-child-process", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
shell-words = "1.1.1"
similar = "3.0.2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.16"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.1.1"
axum = "0.8.7"
insta = { version = "1.43.2", features = ["json"] }
predicates = "3.1.3"
portable-pty = "0.9.0"
proptest = "1.9.0"
tempfile = "3.23.0"

[lints]
workspace = true
