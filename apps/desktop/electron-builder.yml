# Packaging for the Axiom desktop app. Brand assets in build/ are generated by
# `pnpm brand:assets` (see build/README.md). Run `pnpm dist` after
# `cargo build --release -p axiomcli` so the sidecar below exists.
appId: stream.axiom.desktop
productName: Axiom
copyright: © 2026 Astrea Foundation
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - resources/**
  - package.json

asar: true
afterPack: scripts/after-pack.cjs
# Signed builds fail if their signing credentials are unavailable. Early-access
# releases explicitly opt out with package-desktop.mjs --unsigned.
forceCodeSigning: true

mac:
  icon: build/icon.icns
  minimumSystemVersion: "11.0"
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  target:
    - target: pkg
  extraResources:
    - from: ../../target/release/${arch}/axiomcli
      to: bin/axiomcli

pkg:
  installLocation: /Applications
  isRelocatable: false
  isVersionChecked: true
  overwriteAction: upgrade
  allowAnywhere: false
  allowCurrentUserHome: false
  allowRootDirectory: true
  scripts: pkg-scripts

dmg:
  sign: true
  # 660×400 pt window; slots sit either side of the arrow drawn in the art.
  background: build/background.tiff
  icon: build/icon.icns
  iconSize: 128
  window:
    width: 660
    height: 400
  contents:
    - x: 200
      y: 204
      type: file
    - x: 460
      y: 204
      type: link
      path: /Applications
  title: Axiom

win:
  icon: build/icon.ico
  signAndEditExecutable: true
  target:
    - target: nsis
  extraResources:
    - from: ../../target/release/${arch}/axiomcli.exe
      to: bin/axiomcli.exe
    - from: build/windows-cli-path.ps1
      to: installer/windows-cli-path.ps1

nsis:
  include: build/installer.nsh
  oneClick: false
  runAfterFinish: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  shortcutName: Axiom

linux:
  executableName: axiom-desktop
  icon: build/icons
  syncDesktopName: true
  category: Utility
  synopsis: Private AI chat sealed on your machine
  target:
    - target: AppImage
    - target: deb
    - target: pacman
  desktop:
    entry:
      Name: Axiom
      StartupWMClass: Axiom
  extraResources:
    - from: ../../target/release/axiomcli
      to: bin/axiomcli

deb:
  packageName: axiom-desktop
  fpm:
    - build/cli/axiomcli=/usr/bin/axiomcli
  depends:
    - libc6 (>= 2.35)
    - zlib1g
    - libgbm1
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
    - bubblewrap

pacman:
  packageName: axiom-desktop
  artifactName: ${name}-${version}-${arch}.pkg.tar.xz
  fpm:
    - build/cli/axiomcli=/usr/bin/axiomcli
  depends:
    - alsa-lib
    - at-spi2-core
    - bubblewrap
    - gtk3
    - libnotify
    - libsecret
    - libxss
    - libxtst
    - mesa
    - nss
    - xdg-utils
    - zlib
