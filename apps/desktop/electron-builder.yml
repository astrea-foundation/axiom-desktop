# Packaging for the Axiom desktop app. Brand assets in build/ are generated by
# `pnpm brand:assets` (see build/README.md). Run `pnpm dist` after
# `cargo build --release -p axiomcli` so the sidecar below exists.
appId: stream.axiom.desktop
productName: Axiom
copyright: © 2026 Astrea Foundation
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - resources/**
  - package.json

asar: true

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extraResources:
    - from: ../../target/release/axiomcli
      to: bin/axiomcli

dmg:
  # 660×400 pt window; slots sit either side of the arrow drawn in the art.
  background: build/background.tiff
  icon: build/icon.icns
  iconSize: 128
  window:
    width: 660
    height: 400
  contents:
    - x: 200
      y: 204
      type: file
    - x: 460
      y: 204
      type: link
      path: /Applications
  title: Axiom

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  extraResources:
    - from: ../../target/release/axiomcli.exe
      to: bin/axiomcli.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  shortcutName: Axiom

linux:
  icon: build/icons
  category: Utility
  synopsis: Private AI chat sealed on your machine
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: Axiom
      StartupWMClass: stream.axiom.desktop
  extraResources:
    - from: ../../target/release/axiomcli
      to: bin/axiomcli
