[package]
name = "axiom-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Builds the deterministic encrypted-provider integration harness. Production
# packages must not enable this feature.
test-fixture = ["axiom-secure-client/test-fixture"]

[dependencies]
axiom-installation.workspace = true
axiom-inference.workspace = true
axiom-openai-compat.workspace = true
axiom-secure-client.workspace = true
axum = { version = "0.8.7", features = ["json", "http1", "tokio"] }
clap = { version = "4.5.50", features = ["derive", "env"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.17"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }

[lints]
workspace = true
