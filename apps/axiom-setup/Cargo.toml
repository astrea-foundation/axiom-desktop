[package]
name = "axiom-setup"
version = "1.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
axiom-update-client.workspace = true
axiom-installation.workspace = true
directories = "6.0.0"
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "=1.0.13", default-features = false, features = ["notice", "progress-bar", "high-dpi"] }

[build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true
