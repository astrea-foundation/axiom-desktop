[project]
name = "axiom-chutes"
version = "0.1.0"
description = "Chutes confidential-runtime deployment and qualification tools for Axiom"
requires-python = ">=3.12,<3.14"
dependencies = [
    "certifi==2026.10.19",
    "cryptography==50.0.2",
    "dcap-qvl==0.7.0",
    "httpx==0.28.1",
    "pillow>=12,<14",
    "pqcrypto==1.0.0",
]

[project.optional-dependencies]
deployment = ["chutes==0.6.9", "aiohttp>=3.10,<4"]

[dependency-groups]
bundle = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
axiom-chutes = "axiom_chutes.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
