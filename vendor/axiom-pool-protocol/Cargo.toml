[package]
name = "axiom-pool-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Request-bound encrypted inference pool protocol"

[features]
test-fixture = []

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hex = "0.4"
hpke = "0.13"
p256 = { version = "0.13", features = ["ecdsa"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
zeroize = { version = "1", features = ["derive"] }
ehbp = { package = "tinfoil-ehbp", git = "https://github.com/tinfoilsh/encrypted-http-body-protocol", rev = "93cc1fa1ad61e19f9a34fb23cb5b5d5635d3edb0", default-features = false, features = ["rustls-no-provider"] }

[dev-dependencies]
proptest = "1"

[[example]]
name = "generate_vectors"
required-features = ["test-fixture"]
