[package]
name = "axiom-direct-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Native independent AMD SNP and NVIDIA attestation verifier for AstreaAI"

[[bin]]
name = "axiom-direct-verify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
p384 = { version = "0.13", features = ["ecdsa"] }
pem = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sev = { version = "8.0.0", default-features = false, features = ["snp"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std"] }
url = "2"
x509-parser = { version = "0.18", features = ["verify"] }

[workspace]
